version: 0.2

# Stage 3: ask the deployed system whether it works.
#
# This is the only check in the whole pipeline that can speak for the running
# environment. The unit tests prove the rules, Playwright proves the screens against a
# stub, and neither of them can say a word about Cognito, about Postgres, or about
# whether a frame put in an S3 bucket comes back out as a recognised plate. These two
# suites exercise exactly that, over real HTTP with a real token.
#
# What they leave behind, and what has been done about it.
#
# The Cognito users are now removed on every run, here included: deleting one needs an
# IAM permission and nothing else. That cleanup used to sit behind an early return for a
# missing DATABASE_URL, so this stage had never once run it, and nineteen test accounts
# had collected in the pool.
#
# The fixtures are now taken down through the API too, with the administrator's token
# and no database at all: the period is deleted outright, the resident is deactivated,
# and the bay is retired. So nothing a run creates is visible to an administrator
# afterwards - which is what went wrong before, when a test period sat on the admin
# screen announcing itself as "2235-Q1, ready to draw".
#
# What that costs, and it is deliberate: the draw itself is not run here. A committed
# run is a record, and cycleRemovalBlocker refuses to delete a period that has one, so
# running the draw would make the period permanent. The write path is covered by the
# unit tests instead, and the audit and report checks read a run that already exists.
# Set DATABASE_URL and the suite runs the draw and clears it afterwards - which is what
# a developer gets, and this project deliberately does not.
#
# Two inert rows per run are still left: the deactivated resident and the retired bay.
# Removing those means reaching the database, which this project cannot do - hotel-db's
# security group admits 5432 from one address and CodeBuild's change every run. Note
# that a DATABASE_URL alone would not be enough, which an earlier version of this
# comment claimed: the credential is not what is missing, the route is.
# apps/api/scripts/clean-smoke-data.mjs clears them, and the pool, from a machine the
# security group admits.

env:
  variables:
    PNPM_VERSION: '9.15.9'
    STAGE: dev
    AWS_REGION: us-east-2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - corepack enable
      - corepack prepare "pnpm@${PNPM_VERSION}" --activate

  pre_build:
    commands:
      # Same reason as the deploy stage: the artifact carries no node_modules, and
      # these suites import the AWS SDK and the Cognito client.
      - pnpm install --frozen-lockfile

  build:
    commands:
      - cd apps/api
      - echo "The API surface - auth, RBAC, paging, the cycle state machine, the draw"
      - node scripts/smoke.mjs
      - echo "Plate recognition, end to end through S3, Rekognition, DynamoDB and Postgres"
      - node scripts/smoke-plates.mjs
