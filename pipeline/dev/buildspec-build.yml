version: 0.2

# Stage 1 of the pipeline: prove the commit, then build what will ship.
#
# The unit tests run again here even though GitHub Actions already ran them on the pull
# request, and that repetition is deliberate. Branch protection can be bypassed by an
# administrator, and on this project the administrator is also the only engineer. A
# pipeline that trusts a check it did not run is a pipeline that will one day deploy
# something that does not compile. A minute of CodeBuild buys that away.
#
# What is NOT repeated: the Playwright suite. It needs two servers and a browser, takes
# a minute and a half, and its whole purpose is to block a merge. After the merge it
# blocks nothing.

env:
  variables:
    # Corepack reads this; it must match the packageManager field in package.json.
    PNPM_VERSION: '9.15.9'

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - corepack enable
      - corepack prepare "pnpm@${PNPM_VERSION}" --activate

  pre_build:
    commands:
      # --frozen-lockfile: a build that is allowed to resolve a different dependency
      # tree than the one that was reviewed is not building the reviewed commit.
      - pnpm install --frozen-lockfile
      - pnpm -r typecheck
      - pnpm --filter @pacs/api test

  build:
    commands:
      - cd apps/web && pnpm build --configuration production && cd "${CODEBUILD_SRC_DIR}"

artifacts:
  # The source tree and the built frontend - but NOT node_modules.
  #
  # pnpm builds node_modules out of symlinks into a content-addressed store, and those
  # do not survive being zipped into an artifact and unzipped in another container:
  # the deploy stage found serverless' bin pointing at a run.js that was no longer
  # there. Serverless v4 compounds it by downloading its real binary in a postinstall,
  # which a copied tree never runs.
  #
  # So the deploy stage installs from the same lockfile instead. It costs about thirty
  # seconds and it is reproducible, which a half-copied dependency tree is not.
  files:
    - '**/*'
  exclude-paths:
    - 'node_modules/**/*'
    - 'apps/*/node_modules/**/*'
    - 'packages/*/node_modules/**/*'
  name: pacs-build

