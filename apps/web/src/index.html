<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PACS — Parking allocation</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A fair, auditable quarterly parking draw for a residential building."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#15171f" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      The ground, inline, so the first paint is slate rather than the browser's white.
      The stylesheet sets the same value; this only has to beat it to the screen. The
      stored light choice is read back in the same breath, because a person who chose
      light should not be flashed the board first.
    -->
    <style>
      html {
        background: #15171f;
      }
      html[data-theme='light'] {
        background: #edeff7;
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem('pacs.theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo carries the whole page. It is a grotesque with a real width axis, which is
      the vernacular of parking-structure signage: expanded and heavy for the stencilled
      bay codes, normal width for everything else. One family, used across its range,
      rather than a display face bolted onto a body face.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
    />
    <!--
      The icon face, subset to the icons actually used via `icon_names`. Google serves
      only those glyphs, so this is a few hundred bytes rather than the whole set - which
      matters against the 180 kB budget for the first route. Add any new icon name here
      or mat-icon renders the literal word. Keep the list alphabetical, and check every
      name exists: one unknown name does not fail - Google silently drops the subset and
      serves the whole face, about 970 kB, with a 200.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back,arrow_forward,balance,calendar_month,check,close,dark_mode,description,fit_screen,format_list_numbered,group,light_mode,local_parking,lock,logout,map,menu,more_vert,my_location,person,refresh,replay,table_rows,videocam,zoom_in,zoom_out&display=swap"
    />
    <!--
      amazon-cognito-identity-js is published for Node and reaches for `global`. Defining
      it here rather than in a polyfill file guarantees it exists before the module graph
      evaluates; a polyfill import would be hoisted alongside the package, not before it.
    -->
    <script>
      window.global = window;
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
